[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-mh"
version = "0.1.0"
description = "SENTINEL — Edge-Native Clinical Intelligence for Mental Health (WHO mhGAP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── LLM inference ──────────────────────────────────────────────────────────
    "ollama>=0.2.1",

    # ── Data store — PINNED per Finding #41 (API surface changed across 0.4–0.8) ─
    "lancedb>=0.13.0",
    "pyarrow>=18.0.0",

    # ── ML models ──────────────────────────────────────────────────────────────
    "sentence-transformers>=2.7.0,<3.0.0",  # CrossEncoder (reranker + NLI)
    "torch>=2.2.0",                          # Backend for sentence-transformers

    # ── Ingestion ──────────────────────────────────────────────────────────────
    "docling>=2.0.0",

    # ── NLP / sentence splitting ───────────────────────────────────────────────
    # scispaCy and its model are bootstrapped separately (see bootstrap_offline.sh)
    "spacy>=3.7.0",
    "nltk>=3.8.0",                           # Fallback sentence tokenizer

    # ── PHI de-identification (fully offline) ──────────────────────────────────
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # ── API / web server ───────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",                  # Correct SSE framing + disconnect detection
    "slowapi>=0.1.9",                        # Rate limiting — Finding #46

    # ── Resilience ─────────────────────────────────────────────────────────────
    "tenacity>=8.3.0",
    "pybreaker>=1.1.0",

    # ── Audit chain ────────────────────────────────────────────────────────────
    "sqlcipher3>=0.5.0",                     # At-rest encryption — Finding #48
    "keyring>=25.0.0",                       # OS Keychain for HMAC + SQLCipher keys

    # ── JSON repair + validation ───────────────────────────────────────────────
    "json-repair>=0.28.0",
    "pydantic>=2.7.0",

    # ── CLI ─────────────────────────────────────────────────────────────────────
    "rich>=13.7.0",
    "typer>=0.12.0",

    # ── Eval ───────────────────────────────────────────────────────────────────
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",        # Test FastAPI with async client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
sentinel = "sentinel.interface.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sentinel", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

